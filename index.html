<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Procedurally generated, infinitely scrolling Chinese landscape." />
    <meta name="theme-color" content="#f2ebd9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>{Shan, Shui}*</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Procedurally generated landscape scroll"></canvas>

    <div id="toolbar" class="chrome">
      <button id="menu-btn" class="tool" title="Settings" aria-expanded="false" aria-controls="menu">&#x2630;</button>
      <button id="sound-btn" class="tool" title="Sound" aria-pressed="false">&#x266A;</button>
      <button id="drift-btn" class="tool" title="Drift: full screen, slowly scrolling">&#x26F6;</button>
      <a class="tool" href="https://github.com/LingDong-/shan-shui-inf" title="Source code">&lt;/&gt;</a>
    </div>

    <form id="menu" class="chrome" hidden>
      <label for="seed">SEED</label>
      <div class="row">
        <input id="seed" title="random seed" autocomplete="off" spellcheck="false" />
        <button type="submit">Generate</button>
        <button type="button" id="random" title="new random seed">&#x21bb;</button>
      </div>

      <label for="sky">SCENE</label>
      <div class="row">
        <select id="sky" title="time of day">
          <option value="auto">Time: now</option>
          <option value="dawn">Dawn</option>
          <option value="day">Day</option>
          <option value="dusk">Dusk</option>
          <option value="night">Night</option>
        </select>
        <select id="season" title="season">
          <option value="auto">Season: now</option>
          <option value="spring">Spring</option>
          <option value="summer">Summer</option>
          <option value="autumn">Autumn</option>
          <option value="winter">Winter</option>
          <option value="ink">Ink only</option>
        </select>
      </div>
      <label class="check"><input id="motion" type="checkbox" /> Mist, birds &amp; weather</label>

      <label for="step">VIEW</label>
      <div class="row">
        <button type="button" id="left" title="view left">&lt;</button>
        <input id="step" title="increment step" type="number" value="200" min="0" max="10000" step="20" />
        <button type="button" id="right" title="view right">&gt;</button>
      </div>
      <label class="check"><input id="auto" type="checkbox" /> Auto-scroll</label>

      <label for="length">SAVE</label>
      <div class="row">
        <input id="length" title="how much of the scroll to save, in world units (one screen is about 700 tall); empty saves what is on screen" type="number" min="100" max="20000" step="100" placeholder="screen" />
        <button type="button" id="save-png" title="Saves a picture, starting at the left edge of the screen">.PNG</button>
        <button type="button" id="save-svg" title="Saves an ink-only vector file, starting at the left edge of the screen">.SVG</button>
      </div>
      <div class="row">
        <button type="button" id="copy" title="Copies a link to this exact spot">Copy link</button>
        <span id="save-status" role="status"></span>
      </div>
    </form>

    <div id="hint" class="chrome">scroll, drag or use &larr; &rarr;</div>
    <div id="busy" hidden>grinding ink&hellip;</div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
